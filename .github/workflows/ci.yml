name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────
  # 1. Go 엔진 단위 테스트
  # ──────────────────────────────────────────
  test-engine:
    name: Go Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run unit tests
        working-directory: ./engine
        run: go test -v ./game/... ./combat/...

  # ──────────────────────────────────────────
  # 2. TinyGo → engine.wasm 빌드
  # ──────────────────────────────────────────
  build-wasm:
    name: Build Wasm
    runs-on: ubuntu-latest
    needs: test-engine
    steps:
      - uses: actions/checkout@v4

      - name: Build Wasm via Docker (TinyGo)
        run: |
          docker compose run --rm -w /app engine ./build.sh

      - name: Copy wasm to client/public
        run: |
          cp engine/build/engine.wasm client/public/wasm/engine.wasm
          cp engine/build/wasm_exec.js client/public/wasm/wasm_exec.js

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: client/public/wasm/
          retention-days: 1

  # ──────────────────────────────────────────
  # 3. React 클라이언트 빌드
  # ──────────────────────────────────────────
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@v4

      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: client/public/wasm/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Build
        working-directory: ./client
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1

  # ──────────────────────────────────────────
  # 4. Cloudflare Pages 배포 (main 브랜치만)
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build-client
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=coop-crawl
